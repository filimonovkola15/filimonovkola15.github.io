<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ресурсы Telegram Bot (Linktree)</title>
<style>
    body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1e1e1e;
        color: #d4d4d4;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 15px;
        margin: 0;
        scroll-behavior: smooth;
    }
    h1 {
        color: #569cd6;
        margin: 20px 0 30px;
        text-align: center;
        font-size: 2rem;
    }
    h2 {
        color: #4ec9b0;
        margin: 30px 0 15px;
        text-align: center;
        font-size: 1.5rem;
    }
    .link-card {
        background-color: #252526;
        color: #d4d4d4;
        padding: 18px 20px;
        margin: 10px auto;
        border-radius: 12px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        font-size: 18px;
        transition: 0.3s;
        text-decoration: none;
        display: block;
        box-sizing: border-box;
    }
    .link-card:hover {
        background-color: #3c3c3c;
        color: #9cdcfe;
        transform: translateY(-3px);
    }
    .link-card span {
        margin-right: 10px;
    }
    .note {
        background-color: #ffeaa7;
        padding: 15px;
        border-left: 6px solid #fdcb6e;
        margin: 25px 0;
        border-radius: 6px;
        color: #2d3436;
        width: 100%;
        max-width: 420px;
        text-align: center;
        font-size: 15px;
        line-height: 1.4;
    }
    footer {
        margin-top: 40px;
        padding: 15px;
        text-align: center;
        font-size: 14px;
        color: #808080;
        border-top: 1px solid #333;
        width: 100%;
        max-width: 600px;
    }
    footer a {
        color: #569cd6;
        text-decoration: none;
    }
    footer a:hover {
        text-decoration: underline;
    }

    /* 📱 Мобильная оптимизация */
    @media (max-width: 600px) {
        body {
            padding: 20px 10px;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.2rem;
            margin: 20px 0 10px;
        }
        .link-card {
            font-size: 16px;
            padding: 15px;
        }
        .note {
            font-size: 14px;
            padding: 12px;
        }
        footer {
            font-size: 12px;
            padding: 10px;
        }
    }
</style>
</head>
<body>
