<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск — ВОЛНА</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .header {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }
        @media (max-width: 1024px) {
            .nav-links {
                display: none !important;
            }
            .nav-right .btn-app, .nav-right .btn-trial, .nav-right .btn-promo {
                display: none !important;
            }
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        @media (min-width: 768px) {
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 30px;
            }
        }
        .movie-card {
            width: 100% !important; /* Force cards to follow grid width */
            margin: 0;
        }
        .movie-card img {
            width: 100%;
            border-radius: 12px;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .search-page {
            padding: 80px 5% 100px;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }
        .search-container {
            max-width: 800px;
            margin: 20px auto 40px;
            position: relative;
        }
        .search-big-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 18px 25px 18px 60px;
            border-radius: 20px;
            font-size: 18px;
            color: white;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        @media (min-width: 768px) {
            .search-big-input {
                padding: 22px 30px 22px 70px;
                font-size: 22px;
                border-radius: 25px;
            }
            .search-container {
                margin: 40px auto 60px;
            }
        }
        .search-big-input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        .search-icon-big {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            pointer-events: none;
        }
        .search-big-input:focus + .search-icon-big {
            color: var(--accent-color);
        }
        .search-results-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #888;
        }
        .categories-chips {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .categories-chips::-webkit-scrollbar { display: none; }
        .chip {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chip:hover, .chip.active {
            background: var(--accent-color);
            color: black;
            border-color: transparent;
        }
    </style>
</head>
<body>
    <header id="main-header">
        <div class="nav-left">
            <a href="index.html" class="logo">
                <svg viewBox="0 0 100 100" width="30" fill="var(--accent-color)">
                    <polygon points="20,10 80,50 20,90" />
                </svg>
                ВОЛНА
            </a>
            <nav class="nav-links">
                <a href="index.html">Главная</a>
                <a href="wave.html">Волна</a>
                <a href="movies.html">Фильмы</a>
                <a href="series.html">Сериалы</a>
            </nav>
        </div>
        <div class="nav-right">
            <a href="login.html" class="user-login" style="color: white; text-decoration: none;">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Войти</span>
            </a>
        </div>
    </header>

    <main class="search-page">
        <div class="search-container">
            <input type="text" class="search-big-input" placeholder="Фильмы, сериалы, актеры..." autofocus>
            <svg class="search-icon-big" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </div>

        <div class="categories-chips">
            <div class="chip active">Все</div>
            <div class="chip">Боевики</div>
            <div class="chip">Комедии</div>
            <div class="chip">Фантастика</div>
            <div class="chip">Триллеры</div>
            <div class="chip">Мультфильмы</div>
            <div class="chip">Аниме</div>
        </div>

        <h2 class="search-results-title">Рекомендуем посмотреть</h2>
        <div class="movie-grid">
            <div class="movie-card" onclick="location.href='movie-details.html'">
                <div class="card-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=2070&auto=format&fit=crop" alt="Movie">
                </div>
                <div class="movie-info">
                    <h3 class="card-title">Новичок</h3>
                    <p class="card-meta">Боевик, Криминал</p>
                </div>
            </div>
            <div class="movie-card" onclick="location.href='movie-details.html'">
                <div class="card-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1925&auto=format&fit=crop" alt="Movie">
                </div>
                <div class="movie-info">
                    <h3 class="card-title">Интерстеллар</h3>
                    <p class="card-meta">Фантастика, Драма</p>
                </div>
            </div>
            <div class="movie-card" onclick="location.href='movie-details.html'">
                <div class="card-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=2059&auto=format&fit=crop" alt="Movie">
                </div>
                <div class="movie-info">
                    <h3 class="card-title">Начало</h3>
                    <p class="card-meta">Фантастика, Триллер</p>
                </div>
            </div>
        </div>
    </main>

    <nav class="mobile-nav">
        <a href="index.html" class="mobile-nav-item">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Главная</span>
        </a>
        <a href="search.html" class="mobile-nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <span>Поиск</span>
        </a>
        <a href="wave.html" class="mobile-nav-item nav-wave">
            <div class="nav-icon-wrapper">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <span>Волна</span>
        </a>
        <a href="favorites.html" class="mobile-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span>Избранное</span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Профиль</span>
        </a>
    </nav>
</body>
</html>
