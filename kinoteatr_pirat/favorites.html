<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное — ВОЛНА</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        @media (max-width: 1024px) {
            .nav-links {
                display: none !important;
            }
            .nav-right .btn-app, .nav-right .btn-trial, .nav-right .btn-promo {
                display: none !important;
            }
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        @media (min-width: 768px) {
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 30px;
            }
        }
        .movie-card {
            width: 100% !important;
            margin: 0;
        }
        .movie-card img {
            width: 100%;
            border-radius: 12px;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .favorites-page {
            padding: 80px 5% 100px;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }
        .favorites-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .favorites-header {
                margin-bottom: 50px;
            }
        }
        .favorites-title {
            font-size: 24px;
            font-weight: 800;
        }
        @media (min-width: 768px) {
            .favorites-title {
                font-size: 36px;
            }
        }
        .empty-favorites {
            text-align: center;
            padding: 100px 20px;
            color: #444;
        }
        .empty-favorites svg {
            margin-bottom: 20px;
            opacity: 0.2;
        }
        .empty-favorites h2 {
            color: #888;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header id="main-header">
        <div class="nav-left">
            <a href="index.html" class="logo">
                <svg viewBox="0 0 100 100" width="30" fill="var(--accent-color)">
                    <polygon points="20,10 80,50 20,90" />
                </svg>
                ВОЛНА
            </a>
            <nav class="nav-links">
                <a href="index.html">Главная</a>
                <a href="wave.html">Волна</a>
                <a href="movies.html">Фильмы</a>
                <a href="series.html">Сериалы</a>
            </nav>
        </div>
        <div class="nav-right">
            <a href="search.html" class="search-icon-btn" style="color: white; margin-right: 15px;">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </a>
            <a href="profile.html" class="user-login" style="color: white;">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
        </div>
    </header>

    <main class="favorites-page">
        <div class="favorites-header">
            <h1 class="favorites-title">Избранное</h1>
            <span style="color: #666; font-weight: 600;">3 фильма</span>
        </div>

        <div class="movie-grid">
            <div class="movie-card" onclick="location.href='movie-details.html'">
                <div class="card-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=2070&auto=format&fit=crop" alt="Movie">
                </div>
                <div class="movie-info">
                    <h3 class="card-title">Новичок</h3>
                    <p class="card-meta">Боевик, Криминал</p>
                </div>
            </div>
            <div class="movie-card" onclick="location.href='movie-details.html'">
                <div class="card-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1925&auto=format&fit=crop" alt="Movie">
                </div>
                <div class="movie-info">
                    <h3 class="card-title">Интерстеллар</h3>
                    <p class="card-meta">Фантастика, Драма</p>
                </div>
            </div>
            <div class="movie-card" onclick="location.href='movie-details.html'">
                <div class="card-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=2059&auto=format&fit=crop" alt="Movie">
                </div>
                <div class="movie-info">
                    <h3 class="card-title">Начало</h3>
                    <p class="card-meta">Фантастика, Триллер</p>
                </div>
            </div>
        </div>
    </main>

    <nav class="mobile-nav">
        <a href="index.html" class="mobile-nav-item">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Главная</span>
        </a>
        <a href="search.html" class="mobile-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <span>Поиск</span>
        </a>
        <a href="wave.html" class="mobile-nav-item nav-wave">
            <div class="nav-icon-wrapper">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <span>Волна</span>
        </a>
        <a href="favorites.html" class="mobile-nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span>Избранное</span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Профиль</span>
        </a>
    </nav>
</body>
</html>
